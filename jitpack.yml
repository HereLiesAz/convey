# JDK 21: what this build (and CI) requires.
jdk:
  - openjdk21

# androidTarget compiles against platform 35. Install it with the image's own sdkmanager,
# accepting licenses non-interactively; AGP's missing-platform auto-download is the fallback.
before_install:
  - |
    SDKM=$(command -v sdkmanager || ls "${ANDROID_HOME:-/opt/android-sdk-linux}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
    if [ -n "$SDKM" ]; then
      yes | "$SDKM" --licenses > /dev/null || true
      "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
    fi

# Publishes every target buildable on Linux (root KMP module, android, desktop, wasmJs; iOS is
# skipped via kotlin.native.ignoreDisabledTargets). settings.gradle.kts leaves the dev modules out
# when JITPACK is set, so nothing but :convey is configured here. $VERSION is the tag/commit
# JitPack is building.
#
# Known JitPack limitation: its coordinate relocation rewrites the wasmJs Compose-resources zip's
# classified file URL in Gradle Module Metadata, so a wasmJs consumer resolving from JitPack does
# not receive this library's bundled resources (e.g. the Azrienoch font). Android and desktop
# package resources inside the AAR/JAR and are unaffected.
install:
  - ./gradlew :convey:publishToMavenLocal -PconveyVersion=$VERSION -x test --no-daemon --stacktrace

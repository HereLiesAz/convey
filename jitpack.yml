jdk:
  - openjdk17

# JitPack's default build (no jitpack.yml) attempts to publish every
# target in this multi-target KMP module, including androidTarget --
# which fails outright without an Android SDK on JitPack's own runner,
# the same way it does in any environment without one configured. That
# failure doesn't just fail the Android artifact: it aborts the whole
# publish task graph before later tasks -- including the wasmJs target's
# Compose Multiplatform resources artifact (the `-kotlin_resources.zip`
# classifier a consumer's runtime font/image loading actually needs, not
# just the compiled .klib) -- ever run, so a consumer resolving this
# module from JitPack gets working Kotlin code and a missing resource at
# runtime, with no compile-time signal that anything is wrong.
#
# Publishing only the wasmJs target's own Maven publication sidesteps
# the Android SDK requirement entirely and reliably produces every
# artifact (.klib, .pom, .module, sources jar, and the resources zip)
# a wasmJs consumer needs. Verified locally: `./gradlew
# :convey:publishWasmJsPublicationToMavenLocal` produces
# `convey-wasm-js-<version>-kotlin_resources.kotlin_resources.zip`
# alongside the .klib; the default multi-target `publishToMavenLocal`
# does not, for exactly the reason above.
#
# `publishWasmJsPublicationToMavenLocal` alone was still an incomplete
# fix: it only writes the `convey-wasm-js` artifact, never the *root*
# `convey` Maven module (Kotlin Multiplatform's `kotlinMultiplatform`
# publication) -- the one a consumer's plain `com.github.<owner>.convey:
# convey:<version>` coordinate (no `-wasm-js` suffix) actually resolves
# against, with Gradle Module Metadata's `available-at` pointing at
# `convey-wasm-js` as the real per-target variant. Without it, every
# commit built under this jitpack.yml 404s on that root .pom -- verified
# directly: `com/github/<owner>/convey/convey/<version>/convey-<version>.pom`
# never existed for any commit built this way, only for commits built
# before this file existed (whose default multi-target build happened to
# run the `kotlinMultiplatform` publish task too, before the doomed
# Android task ran). Publishing both, as below, produces the root
# `convey` module (with its `available-at` pointer) *and*
# `convey-wasm-js` (with the resources zip) side by side -- verified
# locally: both `compose/conveyance/convey/<version>/convey-<version>.pom`
# and `compose/conveyance/convey-wasm-js/<version>/...` exist afterward,
# and the root module's `.module` file's `wasmJsApiElements-published`/
# `wasmJsResourcesElements-published` variants both point at
# `convey-wasm-js`, matching what a `wasmJs`-target consumer resolves.
install:
  - ./gradlew :convey:publishKotlinMultiplatformPublicationToMavenLocal :convey:publishWasmJsPublicationToMavenLocal --no-daemon --stacktrace

name: Publish Android KMP variant

on:
  push:
    branches:
      - feat/publish-android-variant
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish KMP root, wasmJs, and Android release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :convey:publishKotlinMultiplatformPublicationToGitHubPackagesRepository \
            :convey:publishWasmJsPublicationToGitHubPackagesRepository \
            :convey:publishAndroidReleasePublicationToGitHubPackagesRepository \
            -PconveyVersion=$(git rev-parse --short HEAD) \
            --no-daemon --stacktrace
